name: Bug Report
description: Report a bug or unexpected behavior on the wattnet.eu website.
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking the time to report a bug. Please fill in as much detail as possible so we can reproduce and fix the issue.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the bug.
      placeholder: "The publications section shows an empty list after the page loads."
    validations:
      required: true

  - type: input
    id: url
    attributes:
      label: Page URL
      description: The page where the problem appears.
      placeholder: "https://wattnet.eu/resources"
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Minimal steps needed to reproduce the behavior.
      placeholder: |
        1. Open the page in a private window
        2. Scroll to the affected section
        3. Observe the error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened? Include the browser console output if applicable.
      render: text
    validations:
      required: true

  - type: input
    id: browser
    attributes:
      label: Browser and Version
      placeholder: "e.g. Firefox 141, Safari 18.5"
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: Device or Operating System
      placeholder: "e.g. iPhone 15, Ubuntu 24.04"
    validations:
      required: false

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: Drag and drop any screenshots that show the problem.
    validations:
      required: false
