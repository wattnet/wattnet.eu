name: Feature Request
description: Propose a new feature or improvement for the website.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting an improvement. Please describe your proposal clearly so we can evaluate it.

  - type: textarea
    id: problem
    attributes:
      label: Problem or Motivation
      description: What problem does this feature solve, or what use case does it enable?
      placeholder: "The datasets section does not say how often each dataset is updated."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe the feature or change you would like to see.
      placeholder: "Show the update cadence next to each dataset entry."
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Have you considered any alternative solutions or workarounds?
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which part of the site does this relate to?
      options:
        - Home
        - Features
        - Demo
        - Resources
        - Services
        - Contact
        - Navigation or layout
        - Accessibility
        - Performance
        - Documentation
        - CI / tooling
        - Other
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Any other context, examples, or references that support the request.
    validations:
      required: false
